services:
  app:
    build: .
    ports:
      - '127.0.0.1:8200:8200'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8200
      LOG_REQUESTS: 'false'
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
