name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt
      - run: pip install -r ml/requirements-lock.txt
      - run: python -m unittest discover -s ml/tests -v
        env:
          PYTHONPATH: ml/src
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/inference.test.ts

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t disease-demo .
      - run: docker run -d --name disease-demo -p 127.0.0.1:8200:8200 disease-demo
      - run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8200/api/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs disease-demo
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/load-test.mjs
      - run: test "$(docker exec disease-demo id -u)" != "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-result
          path: load-test-result.json
      - run: docker rm -f disease-demo
        if: always()
